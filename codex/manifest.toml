# Codex plugin manifest for prewalk.
#
# Install with:   codex plugin install <path-or-url-to-this-dir>
# (or copy this dir under ~/.codex/plugins/ and enable it).
#
# This plugin bundles the prewalk skills + hooks. The hooks are Python scripts
# (type = "command"); Codex only executes `type = "command"` hook handlers, so
# the logic lives in hooks/*.py invoked via python3. They depend on the shared
# engine at ../_shared/prewalk_core.py — keep this plugin tree next to _shared/.

[plugin]
name = "prewalk"
version = "0.1.0"
description = "Prewalk for Codex: a frontier model explores + plans + lands the first verified edit, then hands the live trajectory to a cheap executor."
author = "prewalk"

# Skills ship under skills/ and are auto-discovered. Hooks are declared in
# hooks/hooks.json so Codex loads them on the right events.
