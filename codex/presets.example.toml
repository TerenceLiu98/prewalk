# Copy to $CODEX_HOME/prewalk-presets.toml (~/.codex/prewalk-presets.toml).
# The active Codex thread is the planner. Presets configure only the executor.
# These model ids are native Codex catalog examples; confirm them against the
# current CLI catalog. executor_effort is requested only when the live
# spawn_agent schema exposes reasoning_effort.

default_preset = "code-value"

[presets.code-value]
description = "Balanced native Codex executor"
executor = "gpt-5.6-terra"
executor_effort = "medium"
max_todos = 12
handoff_mode = "auto"
require_model_routing = true

[presets.code-max]
description = "Higher-capability native Codex executor"
executor = "gpt-5.6-sol"
executor_effort = "high"
max_todos = 12
handoff_mode = "auto"
require_model_routing = true
